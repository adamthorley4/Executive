name: LinkedIn Outreach Pipeline

on:
  schedule:
    - cron: '0 6 * * 1-5'  # 6am UTC Mon-Fri = 10am Dubai (UTC+4)
  workflow_dispatch:         # manual trigger for testing

jobs:
  outreach:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/linkedin-outreach

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: projects/linkedin-outreach/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run LinkedIn outreach pipeline
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: npm start
