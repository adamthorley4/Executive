name: Send post draft to Telegram

on:
  push:
    branches: [main]
    paths:
      - 'drafts/**'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send draft to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import json, urllib.request, os, subprocess

          result = subprocess.run(
              ['git', 'diff', 'HEAD~1', '--name-only', '--', 'drafts/*.txt'],
              capture_output=True, text=True
          )
          changed = [f for f in result.stdout.strip().split('\n') if f.startswith('drafts/') and f.endswith('.txt')]

          if not changed:
              print('No draft file changed in this commit')
              exit(0)

          text = open(changed[0]).read().strip()

          data = json.dumps({
              'chat_id': os.environ['TELEGRAM_CHAT_ID'],
              'text': text
          }, ensure_ascii=False).encode('utf-8')

          req = urllib.request.Request(
              f'https://api.telegram.org/bot{os.environ[\"TELEGRAM_BOT_TOKEN\"]}/sendMessage',
              data=data,
              headers={'Content-Type': 'application/json; charset=utf-8'}
          )
          with urllib.request.urlopen(req) as r:
              print(r.read().decode())
          "
